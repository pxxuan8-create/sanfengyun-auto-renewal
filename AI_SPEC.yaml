# =============================================================================
# DATA SCHEMAS
# =============================================================================

data_schema:

  scan_product_result:
    name: str                 # product display name
    ptype: str                # "vps" | "vhost"
    page_url: str             # product detail page url
    instance_id: str          # from url regex
    instance_type: str        # "freeServer" | "freeVhost"
    expire_time: str          # "YYYY-MM-DD HH:MM:SS" or ""
    can_renew: bool           # legacy field, based on button + "未到时间" text
    renew_time: str           # "请在 XX 后提交" parsed time, or ""
    form_status: str          # CORE: "ready" | "in_review" | "not_yet" | "not_activated"

  fill_and_submit_result:
    success: bool
    response_text: str        # first 800 chars of post-submit page text
    next_renew_time: str      # parsed "请在 XX 后提交" or ""

  config_yaml_schema:
    sanfengyun:
      phone: str
      password: str
    cnblogs:
      email: str
      password: str
      username: str               # blog url path: cnblogs.com/<username>
    settings:
      dry_run: bool               # true = fill form but NO submit (test mode)
      scan_scope: str             # "all" | "vps" | "vhost"
      sanitize_keywords:
        - str                     # list[str]: [from_word, to_word], e.g. ["三丰云", "三丰"]
      check_interval: int         # LEGACY: present in config but NOT used by code
      early_submit_seconds: int   # LEGACY: present in config but NOT used by code
    products:
      - key: str
        name: str
        ptype: str                # "vps" | "vhost"
        url: str
        enabled: bool
    logging:
      level: str                  # "INFO" | "DEBUG" | "WARNING"
      file: str                   # log file path; "" = stdout only
    # 敏感字段（phone/password/email/username/product url）可被环境变量覆盖，
    # 覆盖关系见 sanfengyun_renewal.load_config 的 env_overrides / url_overrides。
    # 通知走 SMTP 邮件：SMTP_HOST / SMTP_USER / SMTP_PASS / SMTP_TO（email_notify.py）

# =============================================================================
# STATE MACHINE (form_status based)
# =============================================================================

state_machine:
  states: [ready, in_review, not_yet, not_activated]
  trigger: every SLEEP_SLICE=60s, check now >= next_allow_submit_ts + TRIGGER_DELAY
  global_data_priority: DOM_page_data > local_json_persistence
  transition_table:

    ready:
      condition: "DOM shows submit form (post url input exists)"
      action: >
        1. publish article on cnblogs -> get article_url + screenshot
        2. fill sanfengyun form with article_url + screenshot
        3. submit form (unless dry_run)
      on_submit_success:
        next_allow_submit_ts: "now + 14400 (4h cooldown for audit)"
        return_value: "ok"
      on_submit_fail:
        next_allow_submit_ts: "now + 1800 (30min retry)"
        return_value: "fail"
      on_publish_fail:
        next_allow_submit_ts: "unchanged (retry next tick)"
        return_value: "fail"

    in_review:
      condition: 'DOM shows "审核中" / "审核" / "等待" keywords'
      action: "skip article publish and form submit; re-scan after 2h until form_status changes"
      next_allow_submit_ts: "now + 7200 (2h, wait audit result, loop scan)"
      return_value: "skip"
      hard_constraint: "MUST NOT publish article in this state"

    not_activated:
      condition: "DOM matches 13 not-activated keywords"
      action: "skip everything"
      next_allow_submit_ts: "now + 86400 (24h, re-check tomorrow)"
      return_value: "skip"

    not_yet:
      condition: 'DOM shows "未到时间" / "请在 XX 后" text'
      action: "skip everything"
      next_allow_submit_ts: "renew_time_ts + TRIGGER_DELAY if parsed; else now + 1800 (30min fallback)"
      return_value: "skip"

# =============================================================================
# HARD CONSTRAINTS — MUST NOT VIOLATE
# =============================================================================

hard_constraint_list:
  - id: HC01
    rule: MUST NOT use multi-thread/threadpool for scheduling; only single-thread slice-sleep loop
    reason: playwright sync api is not thread-safe; simple loop is sufficient

  - id: HC02
    rule: "IF form_status == in_review: NEVER invoke article publish"
    reason: prevent duplicate blog posts while platform is auditing

  - id: HC03
    rule: "After form submit success: wait full 4h (cooldown) before DOM refresh"
    reason: audit result does not appear instantly; immediate re-scan wastes resources

  - id: HC04
    rule: Upload form accepts ONLY single image file; pass string path, NOT list
    reason: sanfengyun form rejects multiple files

  - id: HC05
    rule: DOM parsed data has higher priority than local json; json is ONLY for scheduling
    reason: platform state can change independently; json is just a countdown cache

  - id: HC06
    rule: All notification calls must catch exceptions; notification failure cannot crash main
    reason: user must not lose service automation just because dingtalk is down

  - id: HC07
    rule: Must capture KeyboardInterrupt for clean exit (close browser, save state)
    reason: avoid orphan chromium processes and state loss

  - id: HC08
    rule: Use playwright sync api only; do NOT refactor to async-playwright
    reason: sync is simpler and sufficient for single-process loop

  - id: HC09
    rule: DOM scan must extract expire_time BEFORE clicking renew tab
    reason: tab switch may hide the header area containing expire_time

  - id: HC10
    rule: Cookie domain fix must set secure=False
    reason: some sanfengyun endpoints use http; secure=True drops cookie on http

  - id: HC11
    rule: Vue SPA pages need networkidle + 5s extra wait before reading DOM
    reason: Vue async render; networkidle alone is too early

  - id: HC12
    rule: cnblogs article screenshot MUST be public article page with full_page=True
    reason: sanfengyun audit requires visible public article, not admin edit page

# =============================================================================
# RISK ITEMS
# =============================================================================

risk_items:
  - id: R01
    risk: sanfengyun manual audit only during working hours; no audit at night/weekend/holiday
    impact: instance may expire while waiting audit
    mitigation: none currently (technical_debt TD01)

  - id: R02
    risk: After submit, "审核中" text does not appear instantly on page
    impact: immediate re-scan may misclassify state
    mitigation: 4h post-submit cooldown (HC03)

  - id: R03
    risk: instance_timestamps.json may get corrupted
    impact: state loss on read → full re-scan on next startup
    mitigation: read exception returns {} (full re-scan); write exception logged only

  - id: R04
    risk: playwright may leave orphan chromium processes after crash
    impact: memory/resource leak
    mitigation: KeyboardInterrupt handler closes browser; external `pkill -f chromium` as fallback

  - id: R05
    risk: sanfengyun DOM text/selectors may change after platform update
    impact: scan_product returns wrong form_status
    mitigation: screenshot saved for debugging; keyword lists need manual update

  - id: R06
    risk: cnblogs keyword filter may block article (e.g. "三丰云")
    impact: publish fails
    mitigation: sanitize_from/sanitize_to replacement in config

  - id: R07
    risk: aliyun captcha may evolve beyond current mouse simulation
    impact: cnblogs login fails
    mitigation: _handle_checkbox retry 10 times; manual login fallback needed

# =============================================================================
# TECHNICAL DEBT
# =============================================================================

technical_debt:
  - id: TD01
    debt: no automatic holiday/working-hour detection
    impact: may submit during non-audit hours, wasting 4h cooldown
    suggestion: "add holiday calendar + only trigger during 9:00-18:00 workdays"

  - id: TD02
    debt: no log rotation
    impact: run.log can grow indefinitely
    suggestion: use RotatingFileHandler or TimedRotatingFileHandler

  - id: TD03
    debt: save_instance_state is NOT atomic (direct write, no tmp+rename)
    impact: crash during write may corrupt json
    suggestion: write to tmp file then os.replace

  - id: TD04
    debt: "code duplication: scanner._click_renew_tab and renewer._click_renew_tab are identical"
    impact: maintenance burden
    suggestion: extract to shared utility module

  - id: TD05
    debt: no circuit-breaker for repeated network failure
    impact: may hammer server during outage
    suggestion: add failure counter + backoff

  - id: TD06
    debt: no retry for playwright page.goto timeout
    impact: single network hiccup fails entire product scan
    suggestion: add 2-3 retries with backoff

  - id: TD07
    debt: _extract_expire_time and expire parsing logic duplicated in multiple places
    impact: inconsistency risk
    suggestion: centralize datetime parsing

