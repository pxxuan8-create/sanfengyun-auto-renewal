# =============================================================================
# AI_SPEC.yaml — MACHINE-ONLY PROJECT SPECIFICATION. HUMAN NOT REQUIRED TO READ.
# =============================================================================
# INSTRUCTION FOR LLM (READ FIRST, PARSE STRICTLY):
# 1. Parse ALL fields. Do NOT ignore tags: reusable, coupling, hard_constraint,
#    side_effect, anti_pattern, extract_note, porting_note.
# 2. Classify every function/module:
#      reusable: yes      → copy-paste directly to other projects
#      reusable: partial  → minor adaptation needed before reuse
#      reusable: no       → tightly coupled to THIS project business, cannot extract
# 3. For reusable=yes/partial: output extraction suggestion + required deps +
#    modification points.
# 4. Enforce ALL hard_constraint items. Any code generation must NOT violate them.
# 5. Analyze technical_debt + risk_items for bug-hunting and refactoring.
# 6. State-machine (form_status) must be followed EXACTLY when modifying logic.
# 7. When refactoring/porting: separate generic infra code from sanfengyun-specific
#    business code.
# 8. Output diff-style incremental changes. Avoid full-file rewrite unless asked.
# 9. DOM page data has HIGHER priority than local json. json is ONLY for scheduling
#    countdown, never as source of truth for business state.
# =============================================================================

meta:
  project_name: sanfengyun_auto_renewal
  main_file: sanfengyun_renewal.py
  language: python3
  entry_modes:
    - "--test"    : full flow (scan → publish article → fill form, NO submit)
    - "--once"    : single full run with real submit
    - "<no flag>" : daemon loop mode
  major_deps:
    - playwright (sync api ONLY, NO async-playwright)
    - playwright-stealth
    - pyyaml
    - requests
    - Pillow (optional, for screenshot compression)
    - json, time, datetime, re, logging, os, pathlib (stdlib)
  runtime_model: single_process_single_loop
  sleep_strategy: slice_sleep, SLEEP_SLICE=60s
  signal_support: KeyboardInterrupt → graceful exit (close browser, save state)
  persistence_medium: local json file "instance_timestamps.json"
  external_services:
    - sanfengyun.com (cloud control panel, Vue SPA)
    - cnblogs.com (blog platform)
    - smtp email (notification via SMTP_HOST/SMTP_USER/SMTP_PASS/SMTP_TO env)

persistence_schema:
  file: instance_timestamps.json
  root_type: object
  key_pattern: "$instance_key: str, format: freeServer_<id> / freeVhost_<id>"
  item_schema:
    next_allow_submit_ts: int  # unix timestamp; next permitted trigger time
  note: >
    json is ONLY a scheduling cache. On every trigger the script re-reads DOM
    to get true state. If json and DOM disagree, DOM wins.
  corruption_handling:
    read: FileNotFoundError / JSONDecodeError → return {} (full re-scan on startup)
    write: any exception → logger.error, do NOT crash

global_constants:
  BASE_DIR: Path(__file__).resolve().parent
  SCREENSHOT_DIR: BASE_DIR / "screenshots"     # auto mkdir(exist_ok=True) at import
  STATE_FILE: BASE_DIR / "instance_timestamps.json"
  SLEEP_SLICE: 60          # slice sleep seconds; MUST stay 60 for responsive Ctrl+C
  TRIGGER_DELAY: 60        # buffer after next_ts before trigger (server clock skew)
  URGENT_HINT_THRESHOLD: 1800  # push "urgent" notify when remain <= 30min
  cooldown_seconds:
    submit_success: 14400     # 4h — wait for platform audit
    in_review: 7200           # 2h — wait for audit result, re-scan until form_status changes
    not_activated: 86400      # 24h — re-check unactivated product
    submit_fail: 1800         # 30min — retry after failure
    not_yet_fallback: 1800    # 30min — when DOM has no renew_time text
  hard_constant_locked:
    - SLEEP_SLICE must stay 60 (responsive exit)
    - must use playwright sync api, do NOT switch to async
    - single file upload only, never pass list to set_input_files
    - must use headless=False + Xvfb (Aliyun captcha detects headless=True)
    - must call _ensure_display() before launch_browser with headless=False

