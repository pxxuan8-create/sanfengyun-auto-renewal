# =====================================================================
# 三丰云免费产品自动延期脚本 - 配置文件
# 博客园发文 + 三丰云填表 + SMTP 邮件通知
# =====================================================================
# ⚠️ 安全提示：以下占位符可安全提交到公开仓库。
#    真实账号密码/产品 URL 通过 GitHub Secrets（环境变量）注入，脚本会优先读取环境变量覆盖本文件。
#    GitHub Actions Secrets 对应关系见 README。
#    本地运行时也可直接在本文件填入真实值（注意不要提交到公开仓库）。


# =====================================================================
# 三丰云账号（可用环境变量 SANFENGYUN_PHONE / SANFENGYUN_PASSWORD 覆盖）
# =====================================================================
sanfengyun:
  phone: "13800138000"            # 占位符：真实手机号放 SANFENGYUN_PHONE
  password: "YourSanfengyunPass"   # 占位符：真实密码放 SANFENGYUN_PASSWORD


# =====================================================================
# 博客园账号（可用环境变量 CNBLOGS_EMAIL / CNBLOGS_PASSWORD / CNBLOGS_USERNAME 覆盖）
# =====================================================================
cnblogs:
  login_url: "https://account.cnblogs.com/signin"
  email: "your_email@qq.com"      # 占位符：真实邮箱放 CNBLOGS_EMAIL
  password: "YourCnblogsPass"     # 占位符：真实密码放 CNBLOGS_PASSWORD
  username: "your_username"       # 占位符：真实用户名放 CNBLOGS_USERNAME


# =====================================================================
# 延期产品列表（免费云服务器 / 免费虚拟主机）
# URL 可用环境变量 SANFENGYUN_VPS_URL / SANFENGYUN_VHOST_URL 覆盖（避免把实例 ID 提交到公开仓库）
# =====================================================================
products:
  - key: "vps"
    name: "免费云服务器A"
    ptype: "vps"
    enabled: true
    url: "https://www.sanfengyun.com/control/#/freeServer/100001"   # 旧实例（占位符，实际走 SANFENGYUN_VPS_URL）

  - key: "vps2"
    name: "免费云服务器B"
    ptype: "vps"
    enabled: true
    url: "https://www.sanfengyun.com/control/#/freeServer/100002"   # 新实例（占位符，实际走 SANFENGYUN_VPS2_URL）

  - key: "vhost"
    name: "免费虚拟主机"
    ptype: "vhost"
    enabled: false   # 用户只需要免费云服务器，虚拟主机禁用（不会扫描/延期）
    url: "https://www.sanfengyun.com/control/#/freeVhost/200002"


# =====================================================================
# 运行参数
# =====================================================================
settings:
  # 以下两个是遗留字段，当前版本代码未使用，保留仅为兼容旧配置，可忽略
  check_interval: 600
  early_submit_seconds: 60
  # 部署到服务器/CI 后改成 false 真提交；本地测试期间保持 true 只填表单不提交
  dry_run: false
  sanitize_keywords:
    - "三丰云"
    - "三丰"
  # 扫描范围：
  #   all    = 扫描云服务器 + 虚拟主机（默认）
  #   vps    = 只扫描免费云服务器
  #   vhost  = 只扫描免费虚拟主机
  scan_scope: "vps"
  # 审核轮询：提交延期后每 N 秒扫一次页面，直到审核通过（form_status=not_yet）或超时
  #   review_poll_interval = 轮询间隔（秒），默认 300 = 每 5 分钟
  #   review_max_polls    = 最多轮询次数，默认 36 次 × 5 分钟 ≈ 3 小时
  #   ⚠️ GitHub Actions 单次 job 最长 6 小时，此参数不要调太大（建议 ≤60 次）
  review_poll_interval: 300
  review_max_polls: 36


# =====================================================================
# 日志配置
# =====================================================================
logging:
  level: "INFO"
  file: ""
  console: true
