name: 三丰云每日检测

permissions:
  contents: read

on:
  # 每天一次（UTC 0:20 = 北京 8:20）；workflow 内再做 0~2 小时随机延迟，
  # 让每天实际检测时间点不固定，规避"固定时间=定时任务"的人工检测。
  schedule:
    - cron: '20 0 * * *'

  # 手动触发（测试用，立即执行，无随机延迟）
  workflow_dispatch:

jobs:
  daily-check:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装系统依赖（Xvfb 虚拟显示 + 中文字体）
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb fonts-noto-cjk

      - name: 安装 Python 依赖 + Playwright
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: 随机延迟（仅定时触发时 0~2 小时，手动触发跳过以便测试）
        if: github.event_name == 'schedule'
        run: |
          delay=$(( RANDOM % 7200 ))
          echo "随机延迟 ${delay} 秒（约 $((delay / 60)) 分钟）"
          sleep ${delay}

      - name: 每日检测（只扫描发状态邮件，不提交延期）
        env:
          SANFENGYUN_PHONE: ${{ secrets.SANFENGYUN_PHONE }}
          SANFENGYUN_PASSWORD: ${{ secrets.SANFENGYUN_PASSWORD }}
          SANFENGYUN_VPS2_URL: ${{ secrets.SANFENGYUN_VPS2_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
        run: |
          python sanfengyun_renewal.py --status
